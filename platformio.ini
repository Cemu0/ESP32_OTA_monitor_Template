; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[common]
device_name = myesp32.local

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; upload_speed = 115200
monitor_speed = 115200
build_flags = 
    -D DEBUG
lib_deps =
  jandrassy/TelnetStream

upload_protocol = espota
upload_port = ${common.device_name}  ; or dummy value
extra_scripts = scripts/resolve_ota.py

; pio device monitor -e esp32dev
; Wireless monitor setup, note that you need to press enter to reconnect
monitor_port = socket://${common.device_name}:23
monitor_filters = direct, time, send_on_enter
monitor_echo = yes
